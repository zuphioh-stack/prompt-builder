<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sketchbook Prompt Generator</title>
  <meta name="description" content="Generate words, objects, things, scenarios, and scenes for sketchbook drawing practice." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Sketchbook Prompt Generator</h1>
    <p class="tagline">Ideas to draw, not to render. Everything here is meant for a pencil and paper.</p>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panel-heading">
        <h2>Building blocks</h2>
        <button id="shuffle-all-btn" class="btn btn-secondary" type="button">⟲ Shuffle all</button>
      </div>
      <div id="category-grid" class="category-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <h2>Full prompt</h2>
      </div>
      <div id="full-prompt-card" class="full-prompt-card">
        <p id="full-prompt-text">—</p>
        <div class="full-prompt-actions">
          <button id="generate-prompt-btn" class="btn btn-primary" type="button">✏ New prompt</button>
          <button id="full-prompt-copy" class="btn btn-ghost" type="button">⧉ Copy</button>
          <button id="full-prompt-star" class="btn btn-ghost" type="button">☆ Favorite</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-heading tabs">
        <button class="tab-btn active" data-target="tab-history" type="button">History</button>
        <button class="tab-btn" data-target="tab-favorites" type="button">Favorites</button>
      </div>

      <div id="tab-history" class="tab-panel active">
        <div class="list-heading">
          <span>Recently generated</span>
          <button id="clear-history-btn" class="btn btn-ghost btn-small" type="button">Clear</button>
        </div>
        <ul id="history-list" class="item-list"></ul>
      </div>

      <div id="tab-favorites" class="tab-panel">
        <div class="list-heading">
          <span>Saved for later</span>
          <button id="clear-favorites-btn" class="btn btn-ghost btn-small" type="button">Clear</button>
        </div>
        <ul id="favorites-list" class="item-list"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>A text-only idea generator for sketching practice. No images are generated here.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
