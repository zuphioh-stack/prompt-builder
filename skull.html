<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skull Rotation Tool — Sketchbook Prompt Generator</title>
  <meta name="description" content="A freely rotatable 3D skull for angle and proportion reference while sketching." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c0693a'/%3E%3Cpath d='M9 23l1.5-5.5L20 8l4 4-9.5 9.5z' fill='%23fff'/%3E%3Cpath d='M20 8l2.2-2.2a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4L24 12z' fill='%23f1d8b0'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./js/vendor/three.module.min.js"
      }
    }
  </script>
</head>
<body class="skull-page">
  <div class="skull-scene-wrap">
    <canvas id="skull-canvas"></canvas>
  </div>

  <header class="skull-header">
    <a href="index.html" class="skull-back-link">
      <span class="btn-icon" data-icon="close"></span>
      Back to generator
    </a>
    <div class="header-badge"><span class="btn-icon" data-icon="skull"></span>Skull rotation tool</div>
    <p class="skull-tagline">Drag to orbit, scroll or pinch to zoom — for angle and proportion reference while you sketch.</p>
  </header>

  <div class="skull-toolbar">
    <button id="skull-wireframe-btn" type="button" class="btn btn-ghost">
      <span class="btn-icon" data-icon="categoryThing"></span>
      Wireframe
    </button>
    <button id="skull-reset-btn" type="button" class="btn btn-ghost">
      <span class="btn-icon" data-icon="shuffle"></span>
      Reset view
    </button>
  </div>

  <p class="skull-note">A stylized, procedurally-built form — not a scanned model — for practicing rotation and light, not anatomy reference.</p>

  <script src="js/icons.js"></script>
  <script>
    document.querySelectorAll("[data-icon]").forEach((el) => {
      const name = el.getAttribute("data-icon");
      if (ICONS[name]) el.innerHTML = ICONS[name];
    });
  </script>
  <script type="module" src="js/skull-tool.js"></script>
</body>
</html>
